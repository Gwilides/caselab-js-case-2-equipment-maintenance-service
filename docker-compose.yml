services:
  db:
    image: postgres:16-alpine
    container_name: caselab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-caselab_db}
      POSTGRES_USER: ${DB_USER:-caselab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caselab_secret}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-maintenance-service
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-caselab_db}
      - DB_USER=${DB_USER:-caselab_user}
      - DB_PASSWORD=${DB_PASSWORD:-caselab_secret}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_ACQUIRE=${DB_POOL_ACQUIRE:-30000}
      - DB_POOL_IDLE=${DB_POOL_IDLE:-10000}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - WEATHER_API_URL=https://api.open-meteo.com/v1/forecast
      - REQUEST_TIMEOUT_MS=5000
      - OUTDOOR_MAX_WIND_SPEED=12.0
      - OUTDOOR_MAX_PRECIPITATION=1.0
      - OUTDOOR_MIN_TEMP=-15.0
      - OUTDOOR_MAX_TEMP=35.0
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
